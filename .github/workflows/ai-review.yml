name: AI Review

# Reviews a pull request with PR-Agent on DeepSeek via SirLouen/ai-pr-review.
#
# This repository is public, so reviews run only when a maintainer applies the `ai-review`
# label (or on manual dispatch), and only for pull requests from this repository - fork pull
# requests do not receive secrets and are refused on both entry points.
#
# The review is posted by github-actions[bot] using this workflow's own token.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: string
      publish:
        description: "Post the review to the PR (uncheck for a dry run)"
        required: false
        default: true
        type: boolean
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ( github.event.label.name == 'ai-review' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'dependabot[bot]' )
    # Job-level on purpose: a skipped job (e.g. a label other than ai-review) never joins the
    # group, so it cannot cancel a review that is already running.
    concurrency:
      group: ai-review-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Resolve target PR
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr_number }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          PR_FROM_EVENT: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            n="$INPUT_PR"; publish="$INPUT_PUBLISH"
          else
            n="$PR_FROM_EVENT"; publish="true"
          fi
          if [[ ! "$n" =~ ^[0-9]+$ ]]; then echo "::error::invalid PR number: $n"; exit 1; fi
          [[ "$publish" == "true" ]] || publish="false"
          echo "number=$n" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Reject fork pull requests (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.target.outputs.number }}
        run: |
          head=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.repo.full_name')
          if [[ "$head" != "$REPOSITORY" ]]; then
            echo "::error::PR #${PR_NUMBER} comes from '${head}', not ${REPOSITORY}; refusing"; exit 1
          fi

      - uses: SirLouen/ai-pr-review@b83b322749360efe6226f2b1a08f0876c7aa5fa9 # v1.0.0
        with:
          pr-number: ${{ steps.target.outputs.number }}
          publish: ${{ steps.target.outputs.publish }}
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          github-token: ${{ github.token }}
