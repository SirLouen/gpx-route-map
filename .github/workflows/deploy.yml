name: Deploy to WordPress.org

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            version:
                description: Version to deploy (e.g. 1.0.1)
                required: true
            dry-run:
                description: Dry run (build & stage, but do not commit to SVN)
                type: boolean
                default: true

concurrency:
    group: wordpress-org
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    deploy:
        name: Build & deploy
        runs-on: ubuntu-latest
        if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
        steps:
            - name: Check out
              uses: actions/checkout@v4

            - name: Set up pnpm
              uses: pnpm/action-setup@v4

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies & build
              run: |
                  pnpm install --frozen-lockfile
                  pnpm run build

            - name: Resolve version (strip leading "v")
              id: version
              run: |
                  RAW="${{ github.event.inputs.version || github.event.release.tag_name }}"
                  echo "version=${RAW#v}" >> "$GITHUB_OUTPUT"

            - name: Deploy to WordPress.org
              id: deploy
              uses: 10up/action-wordpress-plugin-deploy@stable
              with:
                  generate-zip: true
                  dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
              env:
                  SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
                  SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
                  SLUG: gpx-route-map
                  VERSION: ${{ steps.version.outputs.version }}

            - name: Attach built zip to the GitHub release
              if: github.event_name == 'release'
              uses: softprops/action-gh-release@v2
              with:
                  files: ${{ steps.deploy.outputs.zip-path }}
