name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    php:
        name: PHP (phpcs · PHPStan · Pest)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  coverage: none
                  tools: composer

            - name: Install project dependencies
              run: composer install --no-interaction --prefer-dist

            - name: Install PHPCS + WordPress standards (global, no repo changes)
              run: |
                  composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
                  composer global require --no-interaction "wp-coding-standards/wpcs:^3" "dealerdirect/phpcodesniffer-composer-installer:^1"
                  echo "$(composer global config bin-dir --absolute)" >> "$GITHUB_PATH"

            - name: Coding standards (phpcs.xml.dist)
              run: phpcs

            - name: Static analysis (PHPStan max, on PHP 8.3 and as PHP 7.4)
              run: composer analyse -- --no-progress

            - name: Unit tests (Pest)
              run: composer test

    php-74:
        name: PHP 7.4 (syntax)
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v7

            - name: Set up PHP 7.4 (the plugin's minimum)
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '7.4'
                  coverage: none
                  tools: none

            - name: Lint every shipped PHP file (php -l)
              shell: bash
              run: |
                  # The files the WordPress.org deploy ships: the tree minus .distignore,
                  # listed the way 10up/action-wordpress-plugin-deploy copies it (rsync).
                  # Only build/ is left out, as the deploy creates it: its render.php
                  # is a copy of src/render.php, linted here, and its *.asset.php a
                  # fixed `return array(...)` template from bin/build.mjs.
                  # To a file first: a failing rsync then fails the step, where a
                  # process substitution would hide it behind a partial list.
                  rsync -an --out-format='%n' --exclude-from=.distignore ./ "$RUNNER_TEMP/distignore-probe/" > "$RUNNER_TEMP/shipped.txt"
                  mapfile -t files < <(grep '\.php$' "$RUNNER_TEMP/shipped.txt")
                  if [[ " ${files[*]} " != *" gpx-route-map.php "* ]]; then
                      echo "::error::Could not list the shipped PHP files from .distignore"
                      exit 1
                  fi
                  failed=0
                  for f in "${files[@]}"; do
                      if ! out=$(php -d display_errors=1 -d log_errors=0 -d error_reporting=-1 -l "$f" 2>&1); then
                          failed=$((failed + 1))
                          echo "$out"
                          line=$(sed -nE 's/.* on line ([0-9]+)$/\1/p' <<< "$out" | head -n1)
                          msg=$(grep -m1 'error:' <<< "$out" | sed -E 's/ in [^ ]+ on line [0-9]+$//')
                          echo "::error file=$f,line=${line:-1}::PHP 7.4: ${msg:-$(head -n1 <<< "$out")}"
                      fi
                  done
                  echo "php -l on PHP $(php -r 'echo PHP_VERSION;'): ${#files[@]} shipped PHP files, $failed with errors."
                  [ "$failed" -eq 0 ]

    js:
        name: JS (typecheck · lint · build · vitest)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Set up pnpm
              uses: pnpm/action-setup@v6

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Typecheck
              run: pnpm run typecheck

            - name: Lint JS
              run: pnpm run lint:js

            - name: Build
              run: pnpm run build

            - name: JS unit tests
              run: pnpm run test:js

    plugin-check:
        name: Plugin Check (WordPress.org)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Set up pnpm
              uses: pnpm/action-setup@v6

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm

            - name: Build distributable
              run: |
                  pnpm install --frozen-lockfile
                  pnpm run build
                  pnpm run plugin-zip
                  mkdir -p dist && unzip -q gpx-route-map.zip -d dist

            - name: Run Plugin Check
              uses: WordPress/plugin-check-action@v1
              with:
                  build-dir: ./dist/gpx-route-map
