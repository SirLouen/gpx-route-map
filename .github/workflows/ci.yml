name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    php:
        name: PHP (phpcs · PHPStan · Pest)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  coverage: none
                  tools: composer

            - name: Install project dependencies
              run: composer install --no-interaction --prefer-dist

            - name: Install PHPCS + WordPress standards (global, no repo changes)
              run: |
                  composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
                  composer global require --no-interaction "wp-coding-standards/wpcs:^3" "dealerdirect/phpcodesniffer-composer-installer:^1"
                  echo "$(composer global config bin-dir --absolute)" >> "$GITHUB_PATH"

            - name: Coding standards (phpcs.xml.dist)
              run: phpcs

            - name: Static analysis (PHPStan, max)
              run: composer analyse -- --no-progress

            - name: Unit tests (Pest)
              run: composer test

    js:
        name: JS (typecheck · lint · build · vitest)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Set up pnpm
              uses: pnpm/action-setup@v6

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Typecheck
              run: pnpm run typecheck

            - name: Lint JS
              run: pnpm run lint:js

            - name: Build
              run: pnpm run build

            - name: JS unit tests
              run: pnpm run test:js

    plugin-check:
        name: Plugin Check (WordPress.org)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Set up pnpm
              uses: pnpm/action-setup@v6

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm

            - name: Build distributable
              run: |
                  pnpm install --frozen-lockfile
                  pnpm run build
                  pnpm run plugin-zip
                  mkdir -p dist && unzip -q gpx-route-map.zip -d dist

            # Non-blocking since 2026-09-21. The action runs an unpinned
            # `npm -g i @wordpress/env`, which resolves @wp-playground/cli to
            # 3.1.55 -> @php-wasm/node 3.1.55 -> @php-wasm/node-8-1 3.1.55.
            # That last package was never published; npm stops at 3.1.54, so
            # every run dies with ETARGET. Nothing we can pin from here fixes
            # it -- the version is chosen at runtime inside the action -- and
            # the check is advisory anyway, while phpcs, PHPStan, Pest, tsc
            # and vitest still gate the build.
            # Drop continue-on-error once upstream repairs the release.
            - name: Run Plugin Check
              continue-on-error: true
              uses: WordPress/plugin-check-action@v1
              with:
                  build-dir: ./dist/gpx-route-map
